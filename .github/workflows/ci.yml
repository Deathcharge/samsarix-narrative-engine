name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install project
        run: python -m pip install --upgrade pip setuptools && python -m pip install -e ".[dev,openai,anthropic]"
      - name: Format
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy samsarix_narrative_engine
      - name: Test
        run: python -m pytest
      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pip_audit

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build and inspect metadata
        run: python -m build && python -m twine check dist/*
      - name: Verify wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/samsarix-narrative" --version
          "$RUNNER_TEMP/wheel-check/bin/samsarix-narrative" plan --preset balanced
