[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samsarix-narrative-engine"
version = "0.1.0"
description = "Inspectable, cost-bounded narrative workflows for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Samsarix LLC", email = "contact@samsarix.com" }]
maintainers = [{ name = "Samsarix LLC", email = "support@samsarix.com" }]
keywords = [
    "creative-writing",
    "narrative",
    "storytelling",
    "llm",
    "samsarix",
    "workflow",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.66,<3"]
anthropic = ["anthropic>=0.49,<2"]
dev = [
    "build>=1.2,<2",
    "mypy>=1.15,<2",
    "pip-audit>=2.9,<3",
    "pip>=26.1.2,<27",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "setuptools>=83,<84",
    "twine>=6,<7",
]

[project.scripts]
samsarix-narrative = "samsarix_narrative_engine.cli:main"

[project.urls]
Homepage = "https://samsarix.com"
Documentation = "https://github.com/Deathcharge/samsarix-narrative-engine#readme"
Repository = "https://github.com/Deathcharge/samsarix-narrative-engine.git"
Issues = "https://github.com/Deathcharge/samsarix-narrative-engine/issues"

[tool.setuptools.packages.find]
include = ["samsarix_narrative_engine*"]

[tool.setuptools.package-data]
samsarix_narrative_engine = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["UP045"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
pretty = true
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "9.0.3"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=samsarix_narrative_engine",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: exercises a complete package workflow with a deterministic provider",
]

[tool.coverage.run]
source = ["samsarix_narrative_engine"]
omit = ["samsarix_narrative_engine/__main__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
